  <script>
    function myMap() {
      const myLocation = { lat: 46.4683237, lng: 30.7392784 }; 

      const map = new google.maps.Map(document.getElementById("googleMap"), {
        center: myLocation,
        zoom: 15,
      });

      const marker = new google.maps.Marker({
        position: myLocation,
        map: map,
        title: "Місце фотосесії 📸",
      });
      marker.addListener("click", () => {
        window.open("https://maps.app.goo.gl/YwHBnTCGB94P9pbL9", "_blank");
      });
    }
  </script>
